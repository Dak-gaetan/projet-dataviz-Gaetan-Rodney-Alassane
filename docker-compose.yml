name: dataviz-velib

# Stack : RustFS (data lake S3) + PostgreSQL (gold) + Jupyter/PySpark (traitement) + Streamlit (dashboard)
# Lancement : docker compose up -d

services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: velib-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  # Collecte continue des instantanés Vélib vers ./data/velib_status
  # Non lancé par défaut : docker compose --profile collect up -d collector
  # Suivre l'avancement : docker compose logs -f collector
  collector:
    profiles: ["collect"]
    build: ./docker/collector
    container_name: velib-collector
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: velib-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optionnel : JupyterLab dans Docker. Non lancé par défaut (les notebooks tournent
  # dans VS Code avec l'environnement local). Pour l'activer :
  #   docker compose --profile jupyter up -d
  jupyter:
    profiles: ["jupyter"]
    build: ./docker/jupyter
    container_name: velib-jupyter
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    env_file: .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      RUSTFS_ENDPOINT: http://rustfs:9000
      POSTGRES_HOST: postgres
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark UI
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./src:/home/jovyan/work/src
      - ./ontologie:/home/jovyan/work/ontologie
      - ./data:/home/jovyan/work/data
    working_dir: /home/jovyan/work
    restart: unless-stopped

  dashboard:
    build: ./app
    container_name: velib-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    restart: unless-stopped

volumes:
  rustfs_data:
  pg_data:
